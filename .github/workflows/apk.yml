name: сборка АПК

# Локальная читалка: библиотека + читалка, без единого сетевого пути.
# Собирается здесь, потому что в песочнице нет Android SDK.

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - 'part*.js'
      - 'part1.html'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать читалку из частей
        run: bash build.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Проверить, что сетевых адресов не стало больше
        run: |
          set -e
          # Правило: онлайн в сборке РОВНО столько, сколько названо вслух.
          #   speech.platform.bing.com — голоса Edge (по просьбе человека, 04.11);
          #   www.w3.org              — пространство имён SSML, это не запрос.
          # Любой НОВЫЙ адрес роняет сборку — чтобы «онлайн» не разрастался молча.
          HOSTS=$(grep -rhoE "https?://[a-zA-Z0-9._-]+|wss?://[a-zA-Z0-9._-]+" \
                    part1.html part2.js part3.js part4.js part4a-edge.js part5.js \
                    apk/app/src/main/java \
                  | sed -E 's#^[a-z]+://##' | sort -u || true)
          echo "$HOSTS" | tee -a "$GITHUB_STEP_SUMMARY"
          EXTRA=$(echo "$HOSTS" | grep -vE "^(speech\.platform\.bing\.com|www\.w3\.org|appassets\.androidplatform\.net|schemas\.android\.com)$" || true)
          if [ -n "$EXTRA" ]; then echo "новые сетевые адреса: $EXTRA"; exit 1; fi
          if grep -rlE "GlensEngine|KomaLensBridge|class Updater" apk/app/src/main/java; then
            echo "в исходниках остался посторонний онлайн-код"; exit 1
          fi
          # Lens убран из читалки целиком (просьба 04.11): он не распознавал
          # страницу сам, а требовал открыть сайт и перенести текст руками.
          if grep -rn "lens.google.com\|LENS\.\|KomaLens" part1.html part2.js part3.js part4.js part5.js; then
            echo "движок Lens вернулся в читалку — так нельзя"; exit 1
          fi
          if ! grep -q "android.permission.INTERNET" apk/app/src/main/AndroidManifest.xml; then
            echo "нет INTERNET — онлайн-голос не заработает"; exit 1
          fi
          if ! grep -q "Edg/" apk/app/src/main/java/net/koma/reader/MainActivity.kt; then
            echo "в UA нет токена Edg/ — сервис голосов ответит 403"; exit 1
          fi
          echo "сетевых адресов ровно столько, сколько названо: только голоса Edge" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: apk
        run: gradle --no-daemon assembleDebug

      - name: Проверки и итог
        run: |
          set -e
          APK=$(find apk -name '*.apk' | head -1)
          cp "$APK" koma-local.apk
          md5sum koma-local.apk | tee -a "$GITHUB_STEP_SUMMARY"
          # Модели и страница ДОЛЖНЫ быть внутри.
          for f in assets/models/det.onnx assets/models/rec.onnx assets/models/charset.txt assets/koma-web.html; do
            unzip -l koma-local.apk | grep -q "$f" || { echo "НЕТ $f"; exit 1; }
          done
          # 1.0.20: страница в АПК — ЛЁГКАЯ (без движка WASM). Проверяем это в
          # самом APK, а не в репозитории: однажды gradle уже перекрыл лёгкую
          # сборку полной, и в APK уехали лишние 7,8 МБ.
          unzip -p koma-local.apk assets/koma-web.html > /tmp/page.html
          PAGE=$(stat -c%s /tmp/page.html)
          echo "страница в APK: $PAGE Б" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$PAGE" -lt 6000000 || { echo "в APK попала полная страница ($PAGE Б)"; exit 1; }
          if grep -q "ORT_WASM_GZ" /tmp/page.html; then echo "в странице остался движок WASM"; exit 1; fi
          grep -q "const WORDS\|рыбак\|абвгдежзий" /tmp/page.html || { echo "в странице нет словаря"; exit 1; }
          SZ=$(stat -c%s koma-local.apk)
          echo "размер APK: $SZ Б" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SZ" -lt 52428800 || { echo "APK больше 50 МБ"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs koma-local.apk | grep -i "SHA-256" | head -2 || true

      - uses: actions/upload-artifact@v4
        with:
          name: koma-local
          path: koma-local.apk
          if-no-files-found: error
